name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --prefer-dist

      - name: Run PHP linter
        run: npm run lint:php

      - name: Run JS linter
        run: npm run lint:js

      - name: Run CSS linter
        run: npm run lint:css

      - name: Run unit tests
        run: npm run test:unit

      # The zip holds what the repository doesn't: the build, and the
      # autoloader without development dependencies.
      - name: Plugin ZIP
        run: npm run plugin-zip

      - name: Check the plugin ZIP
        run: |
          unzip -q mermaid-blocks.zip -d plugin-zip
          cd plugin-zip/mermaid-blocks
          if [ ! -f build/block.json ] || [ ! -f vendor/autoload.php ]; then
            echo "::error::The plugin ZIP has no build/ or no autoloader."
            exit 1
          fi
          if [ -d vendor/squizlabs ]; then
            echo "::error::The plugin ZIP holds development dependencies."
            exit 1
          fi
          # Every class must load through the zipped autoloader.
          php -r '
            define( "ABSPATH", getcwd() . "/" );
            require "vendor/autoload.php";
            foreach ( glob( "includes/[A-Z]*.php" ) as $file ) {
              $class = "MermaidBlocks\\" . basename( $file, ".php" );
              if ( ! class_exists( $class ) ) {
                echo "::error::$class does not load from the plugin ZIP.\n";
                exit( 1 );
              }
            }
          '

      - name: Upload the plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: mermaid-blocks
          path: mermaid-blocks.zip
